<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#2a0e13" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="The Game" />
<title>The Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a0e13;
    --bg-edge:#120809;
    --ink:#f2e4e5;
    --muted:#b0868d;
    --ember:#e23b47;
    --ember-deep:#a11f2b;
    --line:rgba(226,59,71,0.30);
    --line-lit:rgba(226,59,71,0.62);
    --fade:.55s;
  }

  *{box-sizing:border-box;}

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }

  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(120% 120% at 50% 40%, var(--bg) 0%, var(--bg-edge) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"Jost", system-ui, sans-serif;
    font-weight:300;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  /* the ember — a smoldering light that flares and settles, like a coal */
  .path{
    position:fixed;
    top:38%;
    left:50%;
    width:min(82vw,580px);
    height:min(82vw,580px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,
      rgba(226,59,71,0.30) 0%,
      rgba(161,31,43,0.15) 34%,
      rgba(42,14,19,0) 70%);
    filter:blur(7px);
    pointer-events:none;
    animation:ember 4.6s ease-in-out infinite;
    z-index:0;
  }
  @keyframes ember{
    0%   {opacity:.62; transform:translate(-50%,-50%) scale(1);}
    12%  {opacity:1;   transform:translate(-50%,-50%) scale(1.07);}
    42%  {opacity:.72; transform:translate(-50%,-50%) scale(1.01);}
    100% {opacity:.62; transform:translate(-50%,-50%) scale(1);}
  }

  .screen{
    display:none;
    min-height:100vh;
    min-height:100dvh;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:
      calc(8vh + env(safe-area-inset-top))
      calc(7vw + env(safe-area-inset-right))
      calc(7vh + env(safe-area-inset-bottom))
      calc(7vw + env(safe-area-inset-left));
    opacity:0;
    transition:opacity var(--fade) ease;
    position:relative;
    z-index:1;
  }
  .screen.active{display:flex;}
  .screen.shown{opacity:1;}
  /* for content that can run taller than the screen (the poem) */
  .screen.scroll{justify-content:flex-start;}

  .signet{
    color:var(--ember);
    font-size:1rem;
    line-height:1;
    margin-bottom:2.2rem;
    opacity:.9;
    text-shadow:0 0 18px rgba(226,59,71,.75);
  }

  .question{
    font-family:"Cormorant Garamond", Georgia, serif;
    font-weight:500;
    font-size:clamp(2rem,7.2vw,3.5rem);
    line-height:1.18;
    letter-spacing:.2px;
    max-width:16ch;
    margin:0 0 2.6rem;
  }

  .field{
    width:min(88vw,420px);
    position:relative;
  }
  .field input{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    color:var(--ink);
    font-family:"Jost", system-ui, sans-serif;
    font-weight:300;
    font-size:1.35rem; /* >=16px: stops iOS auto-zoom on focus */
    text-align:center;
    letter-spacing:.5px;
    padding:.55rem .25rem .75rem;
    caret-color:var(--ember);
    outline:none;
    transition:border-color .4s ease;
  }
  .field input::placeholder{color:var(--muted); opacity:.6;}
  .field input:focus{border-bottom-color:var(--line-lit);}
  .field.refused input{border-bottom-color:var(--ember);}

  .btn{
    -webkit-appearance:none;
    appearance:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:54px;
    padding:1rem 2.8rem;
    background:transparent;
    border:1px solid var(--line-lit);
    border-radius:999px;
    color:var(--ink);
    font-family:"Jost", system-ui, sans-serif;
    font-weight:400;
    font-size:1rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition:border-color .3s ease, background .3s ease, color .3s ease, transform .15s ease;
  }
  .btn:active{
    transform:scale(.97);
    border-color:var(--ember);
    color:var(--ember);
    background:rgba(226,59,71,.14);
  }
  @media (hover:hover){
    .btn:hover{
      border-color:var(--ember);
      color:var(--ember);
      background:rgba(226,59,71,.09);
    }
  }
  .btn.enter{margin-top:2.2rem;}

  .refusal{
    margin-top:1.6rem;
    min-height:1.2em;
    font-size:.8rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--ember);
    opacity:0;
    transition:opacity .4s ease;
  }
  .refusal.show{opacity:1;}

  /* the poem */
  .poem{
    font-family:"Cormorant Garamond", Georgia, serif;
    font-weight:400;
    font-size:clamp(1.2rem,4.6vw,1.75rem);
    line-height:1.5;
    letter-spacing:.2px;
    max-width:34ch;
    margin:0;
    color:var(--ink);
  }
  .poem p{margin:0 0 1.5rem;}
  .poem p:last-child{margin-bottom:0;}

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--ember);
    outline-offset:4px;
  }

  @keyframes shudder{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    60%{transform:translateX(6px);}
    80%{transform:translateX(-3px);}
  }
  .field.refused{animation:shudder .35s ease;}

  @media (prefers-reduced-motion: reduce){
    .path{animation:none;}
    .screen{transition:none;}
    .field.refused{animation:none;}
    .btn{transition:none;}
  }
</style>
</head>
<body>
  <div class="path" aria-hidden="true"></div>

  <!-- Screen 1: the question -->
  <section class="screen active shown" id="q1" aria-label="Question">
    <div class="signet" aria-hidden="true">&#9670;</div>
    <h1 class="question">What broke to bring us together?</h1>
    <div class="field" id="field1">
      <input id="answer1" type="text" inputmode="text" enterkeyhint="go"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" placeholder="…" aria-label="Your answer" />
    </div>
    <button class="btn enter" id="submit1">Enter</button>
    <p class="refusal" id="refusal1" role="status" aria-live="polite">That isn't what broke. Try again.</p>
  </section>

  <!-- Screen 2: the poem (filled in from the Worker after the correct answer) -->
  <section class="screen scroll" id="poem" aria-label="For you">
    <div class="signet" aria-hidden="true">&#9670;</div>
    <div class="poem" id="poemBody"></div>
  </section>

<script>
  // ── SET THIS to your deployed Worker URL (the same worker, with the new code) ──
  var WORKER_URL = "https://the-game.eeeinvincible.workers.dev/";

  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var FADE = REDUCED ? 0 : 550;

  var screens = {
    q1: document.getElementById('q1'),
    poem: document.getElementById('poem'),
  };

  function show(id){
    var next = screens[id];
    var current = document.querySelector('.screen.active');
    if(current === next) return;

    function reveal(){
      next.classList.add('active');
      void next.offsetWidth;
      next.classList.add('shown');
      window.scrollTo(0, 0);
      var inp = next.querySelector('input');
      if(inp){ setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120); }
    }

    if(current){
      current.classList.remove('shown');
      setTimeout(function(){
        current.classList.remove('active', 'shown');
        reveal();
      }, FADE);
    } else {
      reveal();
    }
  }

  // ask the Worker whether a guess is correct (text/plain body avoids a CORS preflight)
  function check(guess){
    return fetch(WORKER_URL, {
      method: 'POST',
      body: JSON.stringify({ guess: guess })
    }).then(function(res){ return res.json(); });
  }

  (function wireQuestion(){
    var input = document.getElementById('answer1');
    var submit = document.getElementById('submit1');
    var field = document.getElementById('field1');
    var refusal = document.getElementById('refusal1');
    var wrongMsg = (refusal.textContent || '').trim();
    var busy = false;

    function refuse(msg){
      refusal.textContent = msg;
      refusal.classList.add('show');
      field.classList.remove('refused');
      void field.offsetWidth;
      field.classList.add('refused');
    }

    function attempt(){
      if(busy) return;
      busy = true;
      submit.style.opacity = '0.5';
      submit.style.pointerEvents = 'none';

      check(input.value).then(function(data){
        if(data && data.ok){
          refusal.classList.remove('show');
          field.classList.remove('refused');
          input.blur();
          document.getElementById('poemBody').innerHTML = data.poem || '';
          show('poem');
        } else {
          refuse(wrongMsg);
          input.select();
        }
      }).catch(function(){
        refuse('Something broke. Try again.');
      }).then(function(){
        busy = false;
        submit.style.opacity = '';
        submit.style.pointerEvents = '';
      });
    }

    submit.addEventListener('click', attempt);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ e.preventDefault(); attempt(); }
    });
    input.addEventListener('input', function(){ refusal.classList.remove('show'); });
  })();
</script>

</body>
</html>
